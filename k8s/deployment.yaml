apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights
  namespace: cloudcrafter
  labels:
    app: insights
spec:
  selector:
    matchLabels:
      app: insights
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container:  insights
      labels:
        app: insights
    spec:
      containers:
      - name: insights
        image: docker.io/tolani98/insights:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /status/health
            port: 80
          initialDelaySeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        envFrom:
            - secretRef:
              name: insights-secret
        ports:
        - containerPort: 80
      restartPolicy: Always
---

